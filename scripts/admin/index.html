<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>elhellal admin</title>
<style>
  :root {
    --bg: #f5f5f3; --panel: #fff; --side: #fbfbfa; --text: #1c1c1a; --muted: #6e6e68; --line: #e6e6e1; --hover: #f0f0ed;
    --accent: #2459d6; --accent-soft: #e8eefc; --danger: #c62f2f; --danger-soft: #fdecec; --ok: #1f8a4c; --warn-bg: #fff4d6; --warn: #7a5800;
    --radius: 10px; --shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212; --panel: #1b1b1b; --side: #161616; --text: #ececea; --muted: #9a9a94; --line: #2c2c2a; --hover: #232323;
      --accent: #7aa2ff; --accent-soft: #1d2740; --danger: #ff6b6b; --danger-soft: #3a1c1c; --ok: #4cc283; --warn-bg: #3a3014; --warn: #f3d47a;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; background: var(--bg); color: var(--text); }

  /* Layout: sidebar + content */
  .app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  aside { position: sticky; top: 0; height: 100vh; overflow: auto; background: var(--side); border-inline-end: 1px solid var(--line); padding: 18px 12px; display: flex; flex-direction: column; gap: 4px; }
  aside .brand { font-weight: 700; font-size: 16px; padding: 0 10px 14px; }
  aside .group { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 14px 10px 4px; }
  aside nav { display: flex; flex-direction: column; gap: 2px; }
  aside nav button { text-align: start; background: none; border: 0; padding: 7px 10px; border-radius: 8px; color: var(--text); cursor: pointer; font: inherit; display: flex; gap: 10px; align-items: center; }
  aside nav button .ic { width: 18px; text-align: center; opacity: .75; }
  aside nav button:hover { background: var(--hover); }
  aside nav button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  aside nav button .badge { margin-inline-start: auto; font-size: 11px; min-width: 18px; padding: 0 6px; border-radius: 99px; background: var(--warn-bg); color: var(--warn); text-align: center; font-weight: 600; }
  aside .foot .stats { white-space: pre-line; }
  aside .foot { margin-top: auto; padding: 14px 10px 0; color: var(--muted); font-size: 12px; display: grid; gap: 8px; }
  .content { min-width: 0; }
  .pagehead { padding: 22px 28px 0; max-width: 1140px; margin: 0 auto; }
  .pagehead h1 { font-size: 22px; margin: 0 0 2px; }
  .pagehead p { margin: 0; color: var(--muted); }
  main { max-width: 1140px; margin: 0 auto; padding: 18px 28px 40px; }

  .banner { background: var(--warn-bg); color: var(--warn); padding: 10px 14px; border-radius: var(--radius); margin-bottom: 12px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
  input, select, textarea { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  input[type=checkbox], input[type=radio] { accent-color: var(--accent); }
  input[type=search] { flex: 1; min-width: 200px; }
  button.btn { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 8px; padding: 6px 12px; cursor: pointer; white-space: nowrap; box-shadow: var(--shadow); }
  button.btn:hover:not(:disabled) { background: var(--hover); }
  button.danger { color: var(--danger); }
  button.danger:hover:not(:disabled) { background: var(--danger-soft); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
  button.big { padding: 9px 16px; }
  button:disabled { opacity: .45; cursor: default; }
  .list { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .row { display: flex; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); align-items: flex-start; }
  .row:first-child { border-top: 0; }
  .row:hover { background: color-mix(in srgb, var(--hover) 50%, transparent); }
  .row img { width: 72px; height: 48px; object-fit: cover; border-radius: 6px; background: var(--bg); flex: none; }
  .row .body { flex: 1; min-width: 0; }
  .row .title { font-weight: 600; }
  .row .preview { color: var(--muted); font-size: 13px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .meta { color: var(--muted); font-size: 12px; display: flex; gap: 10px; flex-wrap: wrap; margin-top: 2px; }
  .meta a, .link { color: var(--accent); text-decoration: none; cursor: pointer; }
  .actions { display: flex; gap: 6px; flex: none; flex-wrap: wrap; justify-content: flex-end; }
  .pill { font-size: 11px; padding: 1px 8px; border-radius: 99px; background: var(--bg); border: 1px solid var(--line); }
  .pill.bad { color: var(--danger); border-color: currentColor; }
  .pill.ok { color: var(--ok); border-color: currentColor; }
  .empty { padding: 36px; text-align: center; color: var(--muted); }
  .pager { display: flex; gap: 8px; justify-content: center; align-items: center; margin: 14px 0; color: var(--muted); }
  .edit { display: grid; gap: 6px; margin-top: 10px; }
  .edit textarea { min-height: 70px; }
  .edit .two { display: flex; gap: 6px; flex-wrap: wrap; }
  h2 { font-size: 15px; margin: 22px 0 10px; }
  details > summary { cursor: pointer; }
  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; max-width: 90vw; }
  #toast.show { opacity: 1; }
  #toast.err { background: var(--danger); color: #fff; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: start; padding: 8px 12px; border-top: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; border-top: 0; }
  td.num, th.num { text-align: end; font-variant-numeric: tabular-nums; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
  .card + .card { margin-top: 12px; }
  .card .toolbar:last-child { margin-bottom: 0; }
  .card h3 { margin: 0 0 4px; font-size: 15px; display: flex; gap: 8px; align-items: center; }
  .card h3 .n { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 12px; }
  .steps { display: grid; gap: 12px; }
  .big-num { font-size: 15px; margin: 8px 0; }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .log { background: #111; color: #ddd; font: 12px/1.5 ui-monospace, Menlo, monospace; padding: 10px 12px; border-radius: var(--radius); height: 320px; overflow: auto; white-space: pre-wrap; word-break: break-word; margin: 0; }
  .ok { color: var(--ok); } .bad { color: var(--danger); }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    aside { position: sticky; z-index: 10; height: auto; flex-direction: row; align-items: center; overflow-x: auto; padding: 8px 10px; border-inline-end: 0; border-bottom: 1px solid var(--line); }
    aside .brand, aside .group, aside .foot .stats { display: none; }
    aside nav { flex-direction: row; }
    aside nav button { white-space: nowrap; }
    aside .foot { margin: 0; padding: 0 0 0 8px; }
    .pagehead, main { padding-inline: 16px; }
  }
  @media (max-width: 640px) { .row { flex-wrap: wrap; } .row img { display: none; } .actions { width: 100%; justify-content: flex-start; } }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">elhellal admin</div>
    <div id="tabs"></div>
    <div class="foot">
      <span class="stats" id="stats"></span>
      <button class="btn" id="reload" title="Re-read the catalog from disk">↻ Reload data</button>
    </div>
  </aside>
  <div class="content">
    <div class="pagehead"><h1 id="pagetitle"></h1><p id="pagedesc"></p></div>
    <main><div id="view"></div></main>
  </div>
</div>
<div id="toast"></div>

<script>
// Article data is scraped from the web: only ever put it in the DOM via textContent / attributes.
function h(tag, props = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'class') el.className = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of children.flat()) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : {
    method: 'POST', headers: { 'content-type': 'application/json', 'x-admin': '1' }, body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({ error: res.statusText }));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

let toastTimer;
function toast(msg, err) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'show' + (err ? ' err' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = '', 2500);
}

async function act(fn, ok) {
  try { const r = await fn(); dash = null; if (ok) toast(typeof ok === 'function' ? ok(r) : ok); await refreshStats(); render(); }
  catch (e) { toast(e.message, true); }
}

// ─── State ───
const state = { tab: 'articles', q: '', category: '', author: '', sort: 'newest', page: 1, selected: new Set(), editing: null };
let stats = { categories: [] };

async function refreshStats() {
  stats = await api('/api/stats');
  document.getElementById('stats').textContent =
    `${stats.articles.toLocaleString()} articles\n${stats.blockedArticles} blocked · ${stats.blockedAuthors} blocked authors`;
}

// Sidebar: tabs grouped by what you do with them.
const TABS = [
  ['Catalog', [
    ['articles', '▤', 'Articles', 'Search, edit, move or remove articles in the catalog.'],
    ['authors', '◉', 'Authors', 'Every author by article count — view their articles or remove & block them.'],
    ['review', '⚑', 'Review', 'Articles flagged by bun run moderate — keep or remove each one.'],
    ['health', '✚', 'Health', 'Data problems found by check-data, fixable in place.'],
    ['blocked', '⊘', 'Blocked', 'Blocked authors and removed articles — restore or unblock.'],
  ]],
  ['Add content', [
    ['import', '⇣', 'Import', 'Find Substack authors and import their articles, or import external blogs.'],
  ]],
  ['Share', [
    ['publish', '⇡', 'Publish', 'Commit & push to GitHub, then build and deploy the site.'],
    ['social', '✦', 'Social', 'Schedule X / LinkedIn posts and generate TikTok slideshows.'],
    ['pins', '📌', 'Pins', 'Generate or remove Pinterest pin images on R2.'],
    ['push', '🔔', 'Push', 'Notification subscribers and install stats; send a one-off notification.'],
  ]],
  ['More', [
    ['stats', '▥', 'Stats', 'Weekly volume, sources, top authors and most-read articles.'],
  ]],
  // Sibling repos: one entry each, so switching site is one click ([ and ] cycle through them).
  ['Sites', [
    ['sites/quotes', '❝', 'Quotes', 'quotes.elhellal.com — edit quotes, import from Goodreads, build and deploy.'],
    ['sites/books', '▣', 'Books', 'books.elhellal.com — edit book entries and long summaries, build and deploy.'],
    ['sites/biographies', '◐', 'Biographies', 'biographies.elhellal.com — edit biographies, build and deploy.'],
    ['sites/quiz', '?', 'Quiz', 'quiz.elhellal.com — edit the question bank, read player reports, build and deploy.'],
    ['sites/abderahmane', '✚', 'Abderahmane', 'abderahmane.elhellal.com — edit and deploy blog articles; pushing main deploys.'],
    ['leads', '✎', 'Leads', 'Functional-food leads for the abderahmane blog — write, deploy and post.'],
  ]],
];
const TAB_INFO = Object.fromEntries(TABS.flatMap(([, tabs]) => tabs.map(([id, icon, label, desc]) => [id, { icon, label, desc }])));

const SITE_TABS = Object.keys(TAB_INFO).filter((id) => id.startsWith('sites/'));
/** The sidebar entry for the current view: 'sites/<name>' on a site, else the tab. */
const tabKey = () => state.tab === 'sites' ? `sites/${sites.site}` : state.tab;

function renderNav() {
  const changed = (id) => sites.overview?.find((x) => `sites/${x.name}` === id)?.git?.totalFiles;
  document.getElementById('tabs').replaceChildren(...TABS.map(([group, tabs]) => [
    h('div', { class: 'group' }, group),
    h('nav', {}, tabs.map(([id, icon, label]) => h('button', { 'data-tab': id, class: tabKey() === id ? 'active' : '', onclick: () => go(id) },
      h('span', { class: 'ic' }, icon), label,
      changed(id) ? h('span', { class: 'badge', title: `${changed(id)} uncommitted data file(s)` }, changed(id)) : null))),
  ]).flat());
}

/** Switches to a sidebar entry (e.g. 'articles' or 'sites/quiz') and records it in the URL hash. */
function go(id, { fromHash = false } = {}) {
  if (!TAB_INFO[id]) id = 'articles';
  const [tab, site] = id.split('/');
  if (tab === 'sites' && site !== sites.site) { sites.site = site; sites.q = ''; sites.author = ''; sites.book = ''; sites.cat = ''; sites.editing = null; sites.markdown = null; }
  state.tab = tab; state.page = 1; state.selected.clear(); state.editing = null;
  if (!fromHash && location.hash.slice(1) !== id) history.pushState(null, '', '#' + id);
  syncTabs(); render(); scrollTo(0, 0);
}
addEventListener('popstate', () => go(location.hash.slice(1), { fromHash: true }));
addEventListener('keydown', (e) => {
  if (state.tab !== 'sites' || e.metaKey || e.ctrlKey || e.altKey || (e.key !== '[' && e.key !== ']')) return;
  if (e.target.closest('input, textarea, select, [contenteditable]')) return;
  const i = SITE_TABS.indexOf(tabKey());
  go(SITE_TABS[(i + (e.key === ']' ? 1 : SITE_TABS.length - 1)) % SITE_TABS.length]);
});

document.getElementById('reload').onclick = () => act(() => api('/api/reload', {}), 'Reloaded from disk');

function render() {
  const info = TAB_INFO[tabKey()];
  document.getElementById('pagetitle').textContent = info.label;
  document.getElementById('pagedesc').textContent = info.desc;
  document.title = `${info.label} · elhellal admin`;
  ({ articles: renderArticles, authors: renderAuthors, review: renderReview, blocked: renderBlocked, pins: renderPins, import: renderImport, health: renderHealth, publish: renderPublish, social: renderSocial, stats: renderStats, sites: renderSites, leads: renderLeads, push: renderPush })[state.tab]();
}
const view = () => document.getElementById('view');
/** Fills the page for `tab` — unless the user has switched tabs while it was loading. */
function paint(tab, ...children) { if (state.tab === tab) view().replaceChildren(...children); }

// ─── Articles ───
function categoryOptions(selected, withAll) {
  return [
    withAll ? h('option', { value: '' }, 'All categories') : null,
    ...stats.categories.map((c) => h('option', { value: c.category, selected: c.category === selected }, `${c.title} (${c.category}) · ${c.count}`)),
  ];
}

let searchTimer;
async function renderArticles() {
  const params = new URLSearchParams({ q: state.q, category: state.category, author: state.author, sort: state.sort, page: state.page });
  const data = await api('/api/articles?' + params);
  const search = h('input', { type: 'search', placeholder: 'Search title, author, id or URL…', value: state.q, dir: 'auto',
    oninput: (e) => { clearTimeout(searchTimer); searchTimer = setTimeout(() => { state.q = e.target.value; state.page = 1; render(); }, 250); } });

  const visibleIds = data.items.map((a) => a.id_str);
  const allChecked = visibleIds.length > 0 && visibleIds.every((id) => state.selected.has(id));

  paint('articles', 
    h('div', { class: 'toolbar' },
      search,
      h('select', { onchange: (e) => { state.category = e.target.value; state.page = 1; render(); } }, categoryOptions(state.category, true)),
      h('select', { onchange: (e) => { state.sort = e.target.value; render(); } },
        ['newest', 'oldest', 'title'].map((s) => h('option', { value: s, selected: s === state.sort }, `Sort: ${s}`))),
      state.author ? h('button', { class: 'btn', onclick: () => { state.author = ''; state.page = 1; render(); } }, `@${state.author} ✕`) : null,
    ),
    h('div', { class: 'toolbar' },
      h('label', {}, h('input', { type: 'checkbox', checked: allChecked,
        onchange: (e) => { visibleIds.forEach((id) => e.target.checked ? state.selected.add(id) : state.selected.delete(id)); render(); } }), ' Select page'),
      h('span', { class: 'meta' }, `${data.total.toLocaleString()} results`),
      state.selected.size ? h('button', { class: 'btn danger', onclick: () => removeSelected() }, `Remove ${state.selected.size} selected`) : null,
      state.selected.size ? h('button', { class: 'btn', onclick: () => { state.selected.clear(); render(); } }, 'Clear selection') : null,
    ),
    data.items.length ? h('div', { class: 'list' }, data.items.map((a) => articleRow(a))) : h('div', { class: 'list' }, h('div', { class: 'empty' }, 'No articles')),
    pager(data),
  );
  if (document.activeElement === document.body && state.q) { search.focus(); search.setSelectionRange(state.q.length, state.q.length); }
}

function pager(data) {
  if (data.pages <= 1) return '';
  return h('div', { class: 'pager' },
    h('button', { class: 'btn', disabled: data.page <= 1, onclick: () => { state.page--; render(); scrollTo(0, 0); } }, '← Prev'),
    `Page ${data.page} / ${data.pages}`,
    h('button', { class: 'btn', disabled: data.page >= data.pages, onclick: () => { state.page++; render(); scrollTo(0, 0); } }, 'Next →'),
  );
}

function articleMeta(a) {
  return h('div', { class: 'meta' },
    h('a', { onclick: () => { state.tab = 'articles'; state.author = a.screen_name; state.page = 1; syncTabs(); render(); } }, '@' + a.screen_name),
    h('span', {}, a.category), h('span', {}, a.created_at),
    a.url ? h('a', { href: a.url, target: '_blank', rel: 'noreferrer' }, 'source ↗') : null,
    a.live ? h('a', { href: a.live, target: '_blank', rel: 'noreferrer' }, 'on site ↗') : null,
    h('span', {}, a.id_str),
  );
}

function syncTabs() {
  for (const b of document.querySelectorAll('#tabs button')) b.classList.toggle('active', b.dataset.tab === tabKey());
  if (state.tab !== 'sites' && location.hash.slice(1) !== state.tab) history.replaceState(null, '', '#' + state.tab);
}

function articleRow(a, extra) {
  const editing = state.editing === a.id_str;
  return h('div', { class: 'row' },
    h('input', { type: 'checkbox', checked: state.selected.has(a.id_str),
      onchange: (e) => { e.target.checked ? state.selected.add(a.id_str) : state.selected.delete(a.id_str); render(); } }),
    a.original_img_url ? h('img', { src: a.original_img_url, loading: 'lazy', alt: '' }) : null,
    h('div', { class: 'body' },
      h('div', { class: 'title', dir: 'auto' }, a.title),
      h('div', { class: 'preview', dir: 'auto' }, a.preview_text),
      articleMeta(a),
      extra,
      editing ? editForm(a) : null,
    ),
    h('div', { class: 'actions' },
      h('button', { class: 'btn', onclick: () => { state.editing = editing ? null : a.id_str; render(); } }, editing ? 'Close' : 'Edit'),
      h('button', { class: 'btn danger', onclick: () => removeOne(a) }, 'Remove'),
    ),
  );
}

function editForm(a) {
  const title = h('input', { value: a.title, dir: 'auto' });
  const preview = h('textarea', { dir: 'auto' }, a.preview_text);
  const img = h('input', { value: a.original_img_url || '', placeholder: 'Image URL', style: 'flex:1;min-width:200px' });
  const date = h('input', { value: a.created_at, placeholder: 'YYYY-MM-DD', size: 10 });
  const cat = h('select', {}, categoryOptions(a.category, false));
  return h('div', { class: 'edit' }, title, preview, h('div', { class: 'two' }, cat, date, img),
    h('div', { class: 'two' },
      h('button', { class: 'btn primary', onclick: () => act(async () => {
        await api('/api/edit', { id_str: a.id_str, changes: { title: title.value, preview_text: preview.value, original_img_url: img.value, created_at: date.value, category: cat.value } });
        state.editing = null;
      }, 'Saved') }, 'Save'),
      h('span', { class: 'meta' }, 'The slug (URL) stays the same when the title changes.'),
    ));
}

function removeOne(a) {
  const note = prompt(`Remove "${a.title}"?\n\nOptional reason (saved in blocklist.json):`, '');
  if (note === null) return;
  act(() => api('/api/remove', { ids: [a.id_str], note }), 'Removed and blocklisted');
}

function removeSelected() {
  const note = prompt(`Remove ${state.selected.size} articles?\n\nOptional reason:`, '');
  if (note === null) return;
  act(async () => { const r = await api('/api/remove', { ids: [...state.selected], note }); state.selected.clear(); return r; },
    (r) => `Removed ${r.removed} articles`);
}

// ─── Authors ───
let authorQuery = '';
async function renderAuthors() {
  const data = await api('/api/authors?' + new URLSearchParams({ q: authorQuery }));
  const search = h('input', { type: 'search', placeholder: 'Search authors…', value: authorQuery,
    oninput: (e) => { clearTimeout(searchTimer); searchTimer = setTimeout(() => { authorQuery = e.target.value; render(); }, 250); } });
  paint('authors', 
    h('div', { class: 'toolbar' }, search, h('span', { class: 'meta' }, `${data.total.toLocaleString()} authors (top 200 by article count shown)`)),
    h('div', { class: 'list' }, data.items.length ? data.items.map((au) => h('div', { class: 'row' },
      au.image ? h('img', { src: au.image, loading: 'lazy', alt: '', style: 'width:40px;height:40px;border-radius:50%' }) : null,
      h('div', { class: 'body' },
        h('div', { class: 'title' }, '@' + au.screen_name, ' ', au.blocked ? h('span', { class: 'pill bad' }, 'blocked') : null),
        h('div', { class: 'meta' }, `${au.count} articles`, `latest ${au.latest}`, au.categories.slice(0, 6).join(', ')),
      ),
      h('div', { class: 'actions' },
        h('button', { class: 'btn', onclick: () => { state.tab = 'articles'; state.author = au.screen_name; state.q = ''; state.page = 1; syncTabs(); render(); } }, 'View articles'),
        h('button', { class: 'btn danger', onclick: () => blockAuthor(au.screen_name, au.count) }, 'Remove all & block'),
      ),
    )) : h('div', { class: 'empty' }, 'No authors')),

// ─── Pins (R2) ───
const pins = { scopes: new Set(['articles']), mode: 'generate', batch: '', status: null, statusError: '', loadingStatus: false, job: null, next: 0, lines: [], timer: null };
const MODES = {
  generate: 'Generate & upload new pins (adds them to the feed)',
  fix: 'Fix feeds — add images already in the bucket but missing from their feed',
  remove: 'Remove — delete images, record them in published.json, empty the feeds',
};

async function loadPinStatus() {
  pins.loadingStatus = true; pins.statusError = ''; if (state.tab === 'pins') renderPins();
  try { pins.status = await api('/api/pins/status'); }
  catch (e) { pins.statusError = e.message; }
  pins.loadingStatus = false; if (state.tab === 'pins') renderPins();
}

async function pollPinJob() {
  clearTimeout(pins.timer);
  const r = await api('/api/pins/job?from=' + pins.next).catch(() => null);
  if (!r) return;
  pins.allScopes = r.scopes;
  if (r.job && pins.job && r.job.id !== pins.job.id) { pins.lines = []; }
  const wasRunning = pins.job?.running;
  pins.job = r.job;
  if (r.job) { pins.lines.push(...r.job.lines); pins.next = r.job.next; if (pins.lines.length > 5000) pins.lines.splice(0, pins.lines.length - 5000); }
  if (state.tab === 'pins') updatePinJob();
  if (r.job?.running) pins.timer = setTimeout(pollPinJob, 1000);
  else if (wasRunning) { if (state.tab === 'pins') renderPins(); toast(r.job.exitCode === 0 ? 'Pin job finished' : `Pin job exited with code ${r.job.exitCode}`, r.job.exitCode !== 0); loadPinStatus(); }
}

function scopeLabel(s) { return s.startsWith('quiz-') ? `quiz (${s.slice(5)})` : s; }

async function renderPins() {
  if (!pins.allScopes) await pollPinJob();
  if (!pins.status && !pins.loadingStatus && !pins.statusError) loadPinStatus();
  const running = !!pins.job?.running;
  const st = pins.status;

  const statusCard = h('div', { class: 'list' },
    pins.statusError ? h('div', { class: 'empty bad' }, pins.statusError)
    : !st ? h('div', { class: 'empty' }, 'Listing the bucket…')
    : h('table', {},
        h('tr', {}, h('th', {}, 'Content'), h('th', { class: 'num' }, 'Images in R2'), h('th', { class: 'num' }, 'Feed items'), h('th', {}, 'Feed')),
        st.scopes.map((r) => h('tr', {},
          h('td', {}, scopeLabel(r.scope)),
          h('td', { class: 'num' }, r.images.toLocaleString()),
          h('td', { class: 'num' }, r.feedItems === null ? '—' : r.feedItems.toLocaleString()),
          h('td', {}, h('a', { class: 'link', href: r.feedUrl, target: '_blank', rel: 'noreferrer' }, r.feedUrl.split('/').pop() + ' ↗')),
        )),
      ),
  );

  const scopeBoxes = (pins.allScopes || []).map((s) => h('label', {},
    h('input', { type: 'checkbox', checked: pins.scopes.has(s), disabled: running,
      onchange: (e) => { e.target.checked ? pins.scopes.add(s) : pins.scopes.delete(s); renderPins(); } }), ' ', scopeLabel(s)));
  const modeRadios = Object.entries(MODES).map(([m, label]) => h('label', { style: 'display:block' },
    h('input', { type: 'radio', name: 'pinmode', checked: pins.mode === m, disabled: running,
      onchange: () => { pins.mode = m; renderPins(); } }), ' ', m === 'remove' ? h('span', { class: 'bad' }, label) : label));

  paint('pins', 
    h('div', { class: 'toolbar' },
      h('h2', { style: 'margin:0' }, st ? `R2 bucket: ${st.bucket}` : 'R2 bucket'),
      st ? h('span', { class: 'meta' }, `${st.published.toLocaleString()} URLs in published.json (never regenerated) · checked ${new Date(st.checkedAt).toLocaleTimeString()}`) : null,
      h('button', { class: 'btn', disabled: pins.loadingStatus, onclick: loadPinStatus }, pins.loadingStatus ? 'Listing…' : 'Refresh'),
    ),
    statusCard,
    h('h2', {}, 'Run'),
    h('div', { class: 'card' },
      h('div', { class: 'toolbar' }, ...scopeBoxes),
      h('div', { style: 'margin-bottom:12px' }, ...modeRadios),
      h('div', { class: 'toolbar' },
        pins.mode === 'generate' ? h('input', { type: 'number', min: 1, placeholder: 'Batch (default 10000)', value: pins.batch, disabled: running,
          oninput: (e) => { pins.batch = e.target.value; } }) : null,
        h('button', { class: 'btn ' + (pins.mode === 'remove' ? 'danger' : 'primary'), disabled: running || !pins.scopes.size, onclick: startPinJob },
          pins.mode === 'remove' ? 'Remove pins from R2' : pins.mode === 'fix' ? 'Fix feeds' : 'Generate pins'),
        h('button', { class: 'btn danger', disabled: !running, onclick: () => act(() => api('/api/pins/stop', {}), 'Stopping…') }, 'Stop'),
      ),
    ),
    h('h2', { id: 'pinjobtitle' }),
    h('pre', { class: 'log', id: 'pinlog' }),
  );
  updatePinJob(true);
}

function updatePinJob(force) {
  const title = document.getElementById('pinjobtitle'), log = document.getElementById('pinlog');
  if (!title || !log) return;
  const j = pins.job;
  if (!j) { title.textContent = 'Log'; log.textContent = 'No job run since the admin server started.'; return; }
  const status = j.running ? 'running…' : j.stopped ? 'stopped' : j.exitCode === 0 ? 'done' : `failed (exit ${j.exitCode})`;
  const secs = Math.round(((j.endedAt || Date.now()) - j.startedAt) / 1000);
  title.replaceChildren(`Job #${j.id} — ${j.mode} ${j.scopes.map(scopeLabel).join(' + ')} — `,
    h('span', { class: j.running ? '' : j.exitCode === 0 ? 'ok' : 'bad' }, status), h('span', { class: 'meta', style: 'display:inline' }, ` ${secs}s`));
  const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 30;
  log.textContent = '$ ' + j.command + '\n' + pins.lines.join('\n');
  if (atBottom || force) log.scrollTop = log.scrollHeight;
}

function startPinJob() {
  const scopes = [...pins.scopes];
  const body = { mode: pins.mode, scopes, batch: pins.batch };
  if (pins.mode === 'remove') {
    const word = scopes.join('+');
    const typed = prompt(`This deletes every ${scopes.map(scopeLabel).join(', ')} pin image from R2, records their URLs in published.json and empties those feeds.\n\nOnly do this once Pinterest has picked them up. Type "${word}" to confirm:`, '');
    if (typed === null) return;
    if (typed.trim() !== word) return toast('Confirmation did not match', true);
    body.confirm = word;
  }
  act(async () => { await api('/api/pins/run', body); pins.lines = []; pins.next = 0; pins.job = null; await pollPinJob(); }, 'Started');
}

  const secs = Math.round(((j.endedAt || Date.now()) - j.startedAt) / 1000);
  title.replaceChildren(`Import #${j.id} — ${j.mode}${j.scopes.length ? ` (${j.scopes.length})` : ''} — `,
    h('span', { class: j.running ? '' : j.exitCode === 0 ? 'ok' : 'bad' }, status), h('span', { class: 'meta', style: 'display:inline' }, ` ${secs}s`));
  const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 30;
  log.textContent = '$ ' + j.command + '\n' + imp.lines.join('\n');
  if (atBottom || force) log.scrollTop = log.scrollHeight;
}

function startImport() {
  const items = imp.source === 'substack' ? [...cands.sel].join(' ') : imp.text[imp.source] || '';
  const body = { source: imp.source, items, only: imp.only, save: imp.save };
  if (imp.source !== 'substack-fix' && !imp.only && !confirm('Re-check every known source too? This can take a long time.')) return;
  act(async () => { await api('/api/import/run', body); imp.lines = []; imp.next = 0; imp.job = null; await pollImport(); }, 'Started');
}

// ─── Shared: a polled job log (Publish, Social) ───
function jobPoller(key, endpoint, tab, onDone) {
  const st = { job: null, next: 0, lines: [], timer: null, loaded: false, last: null };
  st.poll = async () => {
    clearTimeout(st.timer);
    const r = await api(endpoint + (endpoint.includes('?') ? '&' : '?') + 'from=' + st.next).catch(() => null);
    if (!r) return;
    st.loaded = true; st.last = r;
    if (r.job && st.job && r.job.id !== st.job.id) st.lines = [];
    const wasRunning = st.job?.running;
    st.job = r.job;
    if (r.job) { st.lines.push(...r.job.lines); st.next = r.job.next; if (st.lines.length > 5000) st.lines.splice(0, st.lines.length - 5000); }
    st.update();
    if (r.job?.running) st.timer = setTimeout(st.poll, 1000);
    else if (wasRunning) {
      toast(r.job.exitCode === 0 ? `${r.job.mode} finished` : r.job.stopped ? `${r.job.mode} stopped` : `${r.job.mode} exited with code ${r.job.exitCode}`, r.job.exitCode !== 0 && !r.job.stopped);
      await onDone?.(r);
    }
  };
  st.start = (path, body, ok = 'Started') => act(async () => { await api(path, body); st.lines = []; st.next = 0; st.job = null; await st.poll(); }, ok);
  st.update = (force) => {
    const title = document.getElementById(key + 'jobtitle'), log = document.getElementById(key + 'log');
    if (!title || !log) return;
    const j = st.job;
    if (!j) { title.textContent = 'Log'; log.textContent = 'Nothing run since the admin server started.'; return; }
    const status = j.running ? 'running…' : j.stopped ? 'stopped' : j.exitCode === 0 ? 'done' : `failed (exit ${j.exitCode})`;
    const secs = Math.round(((j.endedAt || Date.now()) - j.startedAt) / 1000);
    title.replaceChildren(`#${j.id} — ${j.mode} — `, h('span', { class: j.running ? '' : j.exitCode === 0 ? 'ok' : 'bad' }, status), h('span', { class: 'meta', style: 'display:inline' }, ` ${secs}s`));
    const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 30;
    log.textContent = '$ ' + j.command + '\n' + st.lines.join('\n');
    if (atBottom || force) log.scrollTop = log.scrollHeight;
  };
  st.view = () => [h('h2', { id: key + 'jobtitle' }), h('pre', { class: 'log', id: key + 'log' })];
  return st;
}

async function loadGit() {
  gitInfo.loading = true;

function defaultMessage(g) {
  const d = g.delta;
  const parts = d ? [d.added && `+${d.added} articles`, d.removed && `−${d.removed} removed`].filter(Boolean) : [];
  return `data: ${parts.length ? parts.join(', ') : 'catalog updates'} (${new Date().toISOString().slice(0, 10)})`;
}

async function renderPublish() {

// Generated media folders (Social tab): pick posted ones and delete them to free space.
const media = { data: null, loading: false, sel: {}, open: {} };
const fmtBytes = (n) => n >= 1e9 ? (n / 1e9).toFixed(1) + ' GB' : n >= 1e6 ? (n / 1e6).toFixed(1) + ' MB' : n ? Math.max(1, Math.round(n / 1e3)) + ' KB' : '0 KB';

async function loadMedia() {
  media.loading = true;
  try { media.data = await api('/api/media'); } catch (e) { toast(e.message, true); }
  media.loading = false;
  for (const r of media.data?.roots ?? []) {
    const names = new Set(r.folders.map((f) => f.name));
    media.sel[r.key] = new Set([...(media.sel[r.key] ?? [])].filter((n) => names.has(n)));
  }
}

function deleteMediaFolders(root) {
  const sel = media.sel[root.key];
  const picked = root.folders.filter((f) => sel.has(f.name));
  const bytes = picked.reduce((n, f) => n + f.bytes, 0);
  const upcoming = picked.filter((f) => !f.past);
  if (!confirm(`Permanently delete ${picked.length} item(s) from ${root.dir}/ (${fmtBytes(bytes)})?`
    + (upcoming.length ? `\n\n⚠️ ${upcoming.length} of them are dated today or later (or undated) — posts scheduled from them may still need these files.` : '')
    + '\n\nhistory.json / used.json are kept, so these items won\'t be picked again.')) return;
  act(async () => { const r = await api('/api/media/delete', { root: root.key, names: [...sel] }); sel.clear(); await loadMedia(); return r; },
    (r) => `Deleted ${r.deleted} item(s), freed ${fmtBytes(r.bytes)}`);
}

function mediaSection(running) {
  if (!media.data && !media.loading) loadMedia().then(() => { if (state.tab === 'social') renderSocial(); });
  const d = media.data;
  const total = d ? d.roots.reduce((n, r) => n + r.bytes, 0) : 0;
  return h('div', { style: 'margin-top:10px' },
    h('div', { class: 'toolbar' }, h('h2', { style: 'margin:0' }, 'Generated media'),
      d ? h('span', { class: 'meta' }, `${fmtBytes(total)} on disk`) : null,
      h('button', { class: 'btn', disabled: media.loading, onclick: async () => { await loadMedia(); renderSocial(); } }, media.loading ? 'Reading…' : 'Refresh')),
    !d ? h('div', { class: 'card meta' }, 'Measuring folders…') : h('div', { class: 'list' }, d.roots.map((r) => {
      const sel = media.sel[r.key] ??= new Set();
      const selBytes = r.folders.filter((f) => sel.has(f.name)).reduce((n, f) => n + f.bytes, 0);
      const past = r.folders.filter((f) => f.past).map((f) => f.name);
      return h('details', { class: 'row', style: 'display:block', open: !!media.open[r.key], ontoggle: (e) => { media.open[r.key] = e.target.open; } },
        h('summary', { style: 'cursor:pointer' }, h('strong', {}, r.label), ' ',
          h('span', { class: 'meta', style: 'display:inline' }, `${r.dir}/ · ${r.exists ? `${r.folders.length} items · ${fmtBytes(r.bytes)}` : 'not created yet'}`)),
        !r.folders.length ? h('div', { class: 'meta', style: 'padding:8px 0' }, 'Empty.') : h('div', {},
          h('div', { class: 'toolbar', style: 'margin:8px 0' },
            h('button', { class: 'btn', disabled: !past.length, onclick: () => { media.sel[r.key] = new Set(past); renderSocial(); } }, `Select posted (${past.length} before today)`),
            h('button', { class: 'btn', onclick: () => { media.sel[r.key] = new Set(r.folders.map((f) => f.name)); renderSocial(); } }, 'All'),
            h('button', { class: 'btn', onclick: () => { sel.clear(); renderSocial(); } }, 'None'),
            h('button', { class: 'btn danger', disabled: running || !sel.size, onclick: () => deleteMediaFolders(r) },

let dash = null;

function weeklyChart(weeks) {
  const W = 760, H = 200, padL = 36, padB = 22, padT = 8;
  const max = Math.max(1, ...weeks.map((w) => w.total));
  const step = Math.pow(10, Math.floor(Math.log10(max)));
  const tick = [1, 2, 5, 10].map((m) => m * step).find((t) => max / t <= 5);
  const top = Math.ceil(max / tick) * tick;
  const bw = (W - padL) / weeks.length;
  const y = (v) => padT + (H - padT - padB) * (1 - v / top);
  const svgNS = 'http://www.w3.org/2000/svg';
  const s = (tag, attrs, ...kids) => { const el = document.createElementNS(svgNS, tag); for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v); el.append(...kids); return el; };
  const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, width: '100%', role: 'img', 'aria-label': 'Articles published per week, last 26 weeks' });
  for (let v = 0; v <= top; v += tick) {
    svg.append(s('line', { x1: padL, x2: W, y1: y(v), y2: y(v), stroke: 'var(--line)', 'stroke-width': 1 }));
    svg.append(s('text', { x: padL - 6, y: y(v) + 4, 'text-anchor': 'end', 'font-size': 11, fill: 'var(--muted)' }, v.toLocaleString()));
  }
  weeks.forEach((w, i) => {
    const x = padL + i * bw + 1, width = Math.max(2, bw - 2), top_ = y(w.total), hgt = y(0) - top_;
    const g = s('g', {});
    g.append(s('title', {}, `Week of ${w.week}: ${w.total.toLocaleString()} articles\nSubstack ${w.substack} · blogs ${w.blogs} · other ${w.other}`));
    g.append(s('rect', { x: padL + i * bw, y: padT, width: bw, height: H - padT - padB, fill: 'transparent' })); // hit area
    if (hgt > 0) g.append(s('path', { d: `M${x},${y(0)} V${top_ + Math.min(4, hgt)} q0,-${Math.min(4, hgt)} ${Math.min(4, width / 2)},-${Math.min(4, hgt)} H${x + width - Math.min(4, width / 2)} q${Math.min(4, width / 2)},0 ${Math.min(4, width / 2)},${Math.min(4, hgt)} V${y(0)} Z`, fill: 'var(--accent)' }));
    g.addEventListener('mouseenter', () => g.setAttribute('opacity', '.75'));
    g.addEventListener('mouseleave', () => g.removeAttribute('opacity'));
    svg.append(g);
    if (i % 4 === 0) svg.append(s('text', { x: padL + i * bw + bw / 2, y: H - 6, 'text-anchor': 'middle', 'font-size': 11, fill: 'var(--muted)' }, w.week.slice(5)));
  });
  return svg;
}

  if (!siteJob.loaded) await siteJob.poll();
  if (!sites.overview) { paint('sites', h('div', { class: 'empty' }, 'Reading the sibling repos…')); await loadSites(); if (!sites.overview) return; }
  const s = sites.overview.find((x) => x.name === sites.site) ?? sites.overview[0];

  if (s.missing) return paint('sites', h('div', { class: 'card' }, `${s.dir} not found`));

  try { content = await ({ quotes: quotesSection, books: () => entriesSection('books'), biographies: () => entriesSection('biographies'), quiz: quizSection, abderahmane: blogSection })[s.name](running); }
  catch (e) { content = h('div', { class: 'card bad' }, e.message); }

  paint('sites', siteCard(s, running), content, ...(siteJob.job?.scopes?.[0] === s.name ? siteJob.view() : []));

  return h('div', { class: 'row' },
    a ? null : h('input', { type: 'checkbox', checked: leads.sel.has(x.url), onchange: (e) => { e.target.checked ? leads.sel.add(x.url) : leads.sel.delete(x.url); render(); } }),
    a?.thumb ? h('img', { src: a.thumb, loading: 'lazy', alt: '', referrerpolicy: 'no-referrer' }) : null,
    h('div', { class: 'body' },
      a ? h('div', { class: 'title', dir: 'rtl' }, a.title) : null,
      h('div', { class: a ? 'meta' : 'title' }, `#${x.n} `, x.title),
      a?.description ? h('div', { class: 'preview', dir: 'rtl' }, a.description) : null,
      h('div', { class: 'meta' },
        h('span', { class: 'pill' + (x.status === 'published' ? ' ok' : '') }, x.status),
        h('span', {}, x.date),
        h('a', { href: x.url, target: '_blank', rel: 'noreferrer' }, 'news ↗'),
        x.slug && !a ? h('span', { class: 'bad' }, `${x.slug}.md is missing`) : null,
        a ? [h('span', {}, `${a.words.toLocaleString()} words`), h('span', {}, x.slug),
          x.change ? h('span', { class: 'pill bad' }, changeLabel[x.change] ?? x.change) : x.onMain ? h('span', { class: 'pill ok' }, 'on main') : h('span', { class: 'pill bad' }, 'not deployed'),
          x.onMain ? h('a', { href: `https://abderahmane.elhellal.com/article/${x.slug}/`, target: '_blank', rel: 'noreferrer' }, 'blog ↗') : null,
          live ? h('span', { class: live.live ? 'ok' : 'bad' }, live.live ? 'live ✓' : 'not live yet') : null] : null,
        x.x_url ? h('a', { href: x.x_url, target: '_blank', rel: 'noreferrer' }, 'X ↗') : null),
      leads.xEdit === x.url ? xUrlForm(x) : null,
      editing ? articleEditor(x) : null),
    h('div', { class: 'actions' },
      !a && x.status !== 'written' && x.status !== 'published' ? h('button', { class: 'btn', onclick: () => act(() => api('/api/leads/write', { urls: [x.url] }), openedClaude) }, 'Write') : null,
      a ? [
        h('button', { class: 'btn', onclick: () => openArticle(x.slug, !!editing) }, editing ? 'Close' : 'Edit'),
        h('button', { class: 'btn primary', disabled: running || !x.change, title: x.change ? 'Commit this file and push main' : 'Nothing to deploy', onclick: () => {
          if (confirm(`Commit ${x.slug}.md and push main? The blog redeploys and the article goes live.`)) leadJob.start('/api/leads/deploy', { slug: x.slug });
        } }, 'Deploy'),
        h('button', { class: 'btn', onclick: async () => {
          try { leads.live[x.slug] = await api('/api/leads/live?slug=' + x.slug); render(); } catch (e) { toast(e.message, true); }
        } }, 'Check live'),
        h('button', { class: 'btn', onclick: () => act(() => api('/api/leads/copy-x', { slug: x.slug }), () => 'Copied as rich text — paste it into a new X Article') }, 'Copy for X'),
        h('button', { class: 'btn', title: 'Opens Claude Code with the skill\'s publish mode (deploys, builds the X draft, asks you before publishing)', onclick: () => {
          if (confirm('Open Claude Code to publish this article (deploy + X Article)? It asks you before publishing on X.')) act(() => api('/api/leads/publish', { slug: x.slug }), openedClaude);
        } }, 'Publish to X…'),
        h('button', { class: 'btn', onclick: () => { leads.xEdit = leads.xEdit === x.url ? null : x.url; render(); } }, x.x_url ? 'X link' : 'Set X link'),
        h('button', { class: 'btn danger', onclick: () => removeArticle(x) }, 'Delete article'),
      ] : null),
  );
}

function xUrlForm(x) {
  const input = h('input', { value: x.x_url ?? '', placeholder: 'https://x.com/…/status/…', style: 'flex:1;min-width:260px' });
  return h('div', { class: 'edit' }, h('div', { class: 'two' }, input,
    h('button', { class: 'btn primary', onclick: () => act(async () => { const r = await api('/api/leads/x-url', { url: x.url, x_url: input.value }); leads.xEdit = null; return r; }, input.value.trim() ? 'Marked published' : 'X link cleared') }, 'Save'),
    h('span', { class: 'meta' }, 'Saving a link marks the lead published; clearing it puts it back to written.')));
}

async function openArticle(slug, open) {
  if (open) { leads.editing = null; return render(); }
  try { const r = await api('/api/leads/article?slug=' + slug); leads.editing = slug; leads.text = r.text; render(); }
  catch (e) { toast(e.message, true); }
}

function articleEditor(x) {
  const area = h('textarea', { dir: 'auto', spellcheck: 'false', style: 'min-height:480px;font:13px/1.6 ui-monospace,Menlo,monospace' }, leads.text);
  area.addEventListener('input', () => { leads.text = area.value; });
  return h('div', { class: 'edit' },
    h('div', { class: 'meta' }, `src/content/article/${x.slug}.md (frontmatter + markdown)`), area,
    h('div', { class: 'two' },
      h('button', { class: 'btn primary', onclick: () => act(async () => { const r = await api('/api/leads/article', { slug: x.slug, text: area.value }); leads.editing = null; return r; }, 'Saved — Deploy to put it live') }, 'Save'),
      h('button', { class: 'btn', onclick: () => { leads.editing = null; render(); } }, 'Cancel')));
}

function removeArticle(x) {
  const typed = prompt(`Delete src/content/article/${x.slug}.md? Type the slug to confirm:\n${x.slug}`);
  if (typed === null) return;
  const skip = confirm('Skip this lead from now on?\nOK = mark it skipped, Cancel = put it back to pending (so it can be rewritten).');
  act(async () => {
    const r = await api('/api/leads/article/remove', { slug: x.slug, confirm: typed.trim(), status: skip ? 'skipped' : 'pending' });
    if (r.live && confirm(`${x.slug} is on the live blog. Commit the deletion and push main now to take it down?`)) await leadJob.start('/api/leads/deploy', { slug: x.slug, message: `Remove article ${x.slug}` });
    return r;
  }, (r) => r.live ? 'Article deleted' : 'Article deleted (it was never deployed)');
}

renderNav();
refreshStats().then(() => go(location.hash.slice(1) || 'articles', { fromHash: true })).catch((e) => toast(e.message, true));
loadSites();
</script>
</body>
</html>
